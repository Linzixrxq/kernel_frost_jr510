name: Build POCO C40 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Compiling Tools & Cross-Compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
        libelf-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzma lzop rsync schedtool \
        xsltproc zip zlib1g-dev clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
        gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

    - name: Compile Kernel via Make
      timeout-minutes: 60
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        export KCFLAGS="-w -Wno-error -Wno-strict-prototypes -Wno-unused-variable -Wno-unused-function"
        export KCPPFLAGS="-w -Wno-error"
        export KCONFIG_NOTIMESTAMP=1

        # VLA Patches
        sed -i 's/static const char defaults\[reg_num\] = {0x76, 0x66, 0x70};/const char defaults[] = {0x76, 0x66, 0x70};/' drivers/soc/jlq/audio-kernel/asoc/codecs/sia81xx/*.c 2>/dev/null || true
        sed -i 's/uint8_t vals\[reg_num\] = {0};/uint8_t vals\[reg_num\]; memset(vals, 0, reg_num);/' drivers/soc/jlq/audio-kernel/asoc/codecs/sia81xx/*.c 2>/dev/null || true
        sed -i 's/const int ms\[len\] = {2, 2, 2, 3};/int ms[4] = {2, 2, 2, 3};/' drivers/soc/jlq/fingerprint/fpc/fpc1020.c 2>/dev/null || true
        sed -i 's/const char ptl_name\[len\]\[16\] = {"fpc_vdd_on", "fpc_rst_hi", "fpc_rst_lo", "fpc_rst_hi"};/char ptl_name[4][16] = {"fpc_vdd_on", "fpc_rst_hi", "fpc_rst_lo", "fpc_rst_hi"};/' drivers/soc/jlq/fingerprint/fpc/fpc1020.c 2>/dev/null || true

        mkdir -p drivers/soc/jlq/touchscreen/focaltech/include/firmware
        touch drivers/soc/jlq/touchscreen/focaltech/include/firmware/fw_sample.i

        mkdir -p out

        # 1. Базовая конфигурация GKI + слияние с вендорскими фрагментами
        make O=out gki_defconfig
        ARCH=arm64 ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/jr510_JGKI.config
        ARCH=arm64 ./scripts/kconfig/merge_config.sh -O out out/.config arch/arm64/configs/vendor/jr510_JGKI-perfuser.config

        # 2. ПРИНУДИТЕЛЬНОЕ ВКЛЮЧЕНИЕ СИСТЕМНЫХ ДРАЙВЕРОВ ANDROID & IPC
        ./scripts/config --file out/.config --set-val CONFIG_ANDROID y
        ./scripts/config --file out/.config --set-val CONFIG_ANDROID_BINDER_IPC y
        ./scripts/config --file out/.config --set-val CONFIG_ANDROID_BINDERFS y
        ./scripts/config --file out/.config --set-str CONFIG_ANDROID_BINDER_DEVICES "binder,hwbinder,vndbinder"

        # 3. ЖЕЛЕЗНЫЙ МОНОЛИТ (=y) ДЛЯ ВСЕЙ ПЕРИФЕРИИ (ИГНОРИРУЕМ МОДУЛИ)
        ./scripts/config --file out/.config --set-val CONFIG_ARCH_JLQ y
        ./scripts/config --file out/.config --set-val CONFIG_CLK_JLQ_JR510 y
        ./scripts/config --file out/.config --set-val CONFIG_GPIO_JLQ y
        ./scripts/config --file out/.config --set-val CONFIG_GPIO_JLQ_QTANG y
        ./scripts/config --file out/.config --set-val CONFIG_PINCTRL_JLQ_SPMI_PMIC y
        ./scripts/config --file out/.config --set-val CONFIG_MMC_SDHCI_JLQ y
        ./scripts/config --file out/.config --set-val CONFIG_REGULATOR_QPNP_LCDB y
        ./scripts/config --file out/.config --set-val CONFIG_MFD_SPMI_PMIC y
        ./scripts/config --file out/.config --set-val CONFIG_JLQ_REGULATOR y
        ./scripts/config --file out/.config --set-val CONFIG_SPMI_MSM_PMIC_ARB y
        
        # МОНОЛИТНЫЙ ЗВУК
        ./scripts/config --file out/.config --set-val CONFIG_SOUNDWIRE y
        ./scripts/config --file out/.config --set-val CONFIG_SND_SOC_SIA81XX y
        ./scripts/config --file out/.config --set-val CONFIG_SND_SOC_JR510 y
        ./scripts/config --file out/.config --set-val CONFIG_SND_SOC_BOLERO y
        
        # МОНОЛИТНЫЙ ДИСПЛЕЙ И ПОДСВЕТКА
        ./scripts/config --file out/.config --set-val CONFIG_DISPLAY_JLQ y
        ./scripts/config --file out/.config --set-val CONFIG_DSI_TRANSMITTER_JLQ y
        ./scripts/config --file out/.config --set-val CONFIG_DISPLAY_CAMILLE y
        
        # МОНОЛИТНЫЙ ТАЧСКРИН
        ./scripts/config --file out/.config --set-val CONFIG_TOUCHSCREEN_FTS y
        ./scripts/config --file out/.config --set-val CONFIG_TOUCHSCREEN_GSL y
        ./scripts/config --file out/.config --set-val CONFIG_TOUCHSCREEN_LCT y

        # ИНЪЕКЦИЯ ДРАЙВЕРОВ КАМЕРЫ В МОНОЛИТ
        ./scripts/config --file out/.config --set-val CONFIG_MSM_PIL y
        ./scripts/config --file out/.config --set-val CONFIG_MSM_SUBSYSTEM_RESTART y
        ./scripts/config --file out/.config --set-val CONFIG_MSM_PIL_SSR_GENERIC y

        # 4. ВКОМПИЛИРОВАНИЕ ДРАЙВЕРОВ ФАЙЛОВЫХ СИСТЕМ ANDROID
        ./scripts/config --file out/.config --set-val CONFIG_EROFS_FS y
        ./scripts/config --file out/.config --set-val CONFIG_EROFS_FS_ZIP y
        ./scripts/config --file out/.config --set-val CONFIG_F2FS_FS y
        ./scripts/config --file out/.config --set-val CONFIG_EXT4_FS y

        # 5. Перевод SELinux в Permissive режим + Фикс CMDLINE от ИИ
sed -i 's/# CONFIG_SECURITY_SELINUX is not set/CONFIG_SECURITY_SELINUX=y/' arch/arm64/configs/gki_defconfig
echo "CONFIG_SECURITY_SELINUX=y" >> arch/arm64/configs/vendor/jr510_JGKI.config
echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> arch/arm64/configs/vendor/jr510_JGKI.config
echo "CONFIG_SECURITY_SELINUX_BOOTPARAM=y" >> arch/arm64/configs/vendor/jr510_JGKI.config
echo "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=1" >> arch/arm64/configs/vendor/jr510_JGKI.config

        # Полный обход ограничений загрузчика Xiaomi
        ./scripts/config --file out/.config --set-str CONFIG_CMDLINE "androidboot.selinux=permissive"
        ./scripts/config --file out/.config --disable CONFIG_CMDLINE_FORCE
        ./scripts/config --file out/.config --enable CONFIG_CMDLINE_EXTEND

        # ПОЛНОЕ ОТКЛЮЧЕНИЕ ЗАГЛУШАЮЩЕГО СИСТЕМУ АУДИТА
        ./scripts/config --file out/.config --disable CONFIG_AUDIT
        ./scripts/config --file out/.config --disable CONFIG_AUDITSYSCALL
        ./scripts/config --file out/.config --disable CONFIG_AUDIT_CONTAINER_ID

        # ОТКЛЮЧЕНИЕ WATCHDOG ЧТОБЫ УБРАТЬ ВЫЛЕТ В FASTBOOT
        ./scripts/config --file out/.config --disable CONFIG_WATCHDOG
        ./scripts/config --file out/.config --disable CONFIG_JLQ_WATCHDOG
        ./scripts/config --file out/.config --disable CONFIG_SOFTLOCKUP_DETECTOR
        ./scripts/config --file out/.config --set-val CONFIG_PANIC_TIMEOUT 0

        # Полное удаление конфликтующего отладочного мусора Xiaomi
        ./scripts/config --file out/.config --disable CONFIG_JLQ_SYSDUMP
        ./scripts/config --file out/.config --disable CONFIG_JLQ_CORE_DUMP

        # 6. Исправление варнингов сборщика
        sed -i 's/CONFIG_WERROR=y/# CONFIG_WERROR is not set/' out/.config
        ./scripts/config --file out/.config --set-val CONFIG_SECTION_MISMATCH_WARN_ONLY y

        # После всех инъекций обязательно обновляем Kconfig зависимости
        make O=out olddefconfig

        # 7. Чистая монолитная сборка (modules больше не собираем, всё ушло в Image)
        make -j$(nproc --all) O=out Image Image.gz

    - name: Upload Compiled Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: POCO-C40-Kernel-Package
        path: |
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/Image.gz
        if-no-files-found: error
