name: Build POCO C40 Kernel

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    # 1. Скачиваем исходники твоего ядра
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    # 2. Устанавливаем ВСЕ инструменты из официальных, вечных зеркал Ubuntu
    - name: Install Compiling Tools & Clang/GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzma lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
        clang clang-format gcc-aarch64-linux-gnu g++-aarch64-linux-gnu gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

    # 3. Запускаем компиляцию ядра
    - name: Compile Kernel via build.config
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        
        # Перенаправляем пути компилятора на официальный встроенный системный Clang
        export CLANG_PREBUILT_BIN_DIR=/usr/bin
        export PATH=$CLANG_PREBUILT_BIN_DIR:$PATH
        
        # Указываем кросс-компиляторы для чипсета JLQ JR510
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # Создаем пустую папку out для результатов сборки
        mkdir -p out/android-kernel/dist
        
        # Запуск официального сборщика Xiaomi
        BUILD_CONFIG=build.config.frost ./build/build.sh

    # 4. Выгружаем готовый результат сборки
    - name: Upload Compiled Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: POCO-C40-Kernel
        path: |
          out/android-kernel/dist/Image.gz
          out/android-kernel/dist/jlq_jr510.dtb
