name: Build POCO C40 Kernel

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    # 1. Скачиваем исходники твоего ядра прямо в корень
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    # 2. Устанавливаем официальный и правильный Clang r416183b для Android R
    - name: Setup Android Clang Toolchain
      uses: android-pan/setup-clang@main
      with:
        clang-version: r416183b

    # 3. Устанавливаем необходимые системные пакеты Linux
    - name: Install Compiling Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzma lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    # 4. Запускаем компиляцию
    - name: Compile Kernel via build.config
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        
        # Направляем оригинальный скрипт Xiaomi на установленный Clang
        export CLANG_PREBUILT_BIN_DIR=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
        export PATH=$CLANG_PREBUILT_BIN_DIR:$PATH
        
        # Настройка флагов кросс-компиляции процессора JLQ JR510
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # Создаем пустую папку out для сборщика
        mkdir -p out/android-kernel/dist
        
        # Запуск официального сборщика Xiaomi
        BUILD_CONFIG=build.config.frost ./build/build.sh

    # 5. Выгружаем готовый результат сборки
    - name: Upload Compiled Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: POCO-C40-Kernel
        path: |
          out/android-kernel/dist/Image.gz
          out/android-kernel/dist/jlq_jr510.dtb
