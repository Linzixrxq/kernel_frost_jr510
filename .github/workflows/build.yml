name: Build POCO C40 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Compiling Tools & Cross-Compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf \
        libelf-dev liblz4-tool libssl-dev libxml2 libxml2-utils lzma lzop rsync schedtool \
        xsltproc zip zlib1g-dev clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
        gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

    - name: Compile Kernel via Make
      timeout-minutes: 60
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        export KCONFIG_NOTIMESTAMP=1
        
        # Создаем папку для вывода
        mkdir -p out
        
        # Поиск правильного defconfig файла
        DEFCONFIG=""
        if [ -f "arch/arm64/configs/frost_defconfig" ]; then
          DEFCONFIG="frost_defconfig"
        elif [ -f "arch/arm64/configs/jr510_defconfig" ]; then
          DEFCONFIG="jr510_defconfig"
        elif [ -f "arch/arm64/configs/vendor/frost_defconfig" ]; then
          DEFCONFIG="vendor/frost_defconfig"
        fi

        if [ -z "$DEFCONFIG" ]; then
          echo "Ищем подходящий defconfig..."
          DEFCONFIG=$(find arch/arm64/configs/ -name "*frost*" -o -name "*jr510*" | head -n 1 | sed 's|arch/arm64/configs/||')
        fi

        echo "Используем конфигурацию: $DEFCONFIG"
        
        # Генерируем .config
        make O=out $DEFCONFIG
        
        # Запускаем сборку ядра и DTB на всех ядрах процессора
        make -j$(nproc --all) O=out Image.gz dtbs modules

    - name: Upload Compiled Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: POCO-C40-Kernel-Image
        path: |
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/dtb.img
          out/arch/arm64/boot/dts/jlq/*.dtb
        if-no-files-found: warn
